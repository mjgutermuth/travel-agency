name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dreamboard/package-lock.json

      - name: Install vision board dependencies
        working-directory: dreamboard
        run: npm ci

      - name: Build vision board
        working-directory: dreamboard
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css script.js CNAME .nojekyll _site/
          cp -r packing _site/packing
          cp -r intake _site/intake
          cp -r credentials _site/credentials
          mkdir -p _site/dreamboard
          cp -r dreamboard/out/. _site/dreamboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
