<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --magenta: #ff6b9d;
    --teal: #4ecdc4;
    --purple: #a78bfa;
    --bg-gradient: linear-gradient(135deg, #fef6e4 0%, #fff1f8 50%, #e8f4f8 100%);
    --text: #1a1a2e;
    --text-muted: #6c757d;
    --border: rgba(0, 0, 0, 0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; }
  .bg {
    position: relative;
    width: 100%;
    height: 400px;
    background: var(--bg-gradient);
    overflow: hidden;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(167, 139, 250, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167, 139, 250, 0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .glow-a {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 107, 157, 0.15) 0%, transparent 70%);
    top: -80px; right: -40px;
  }
  .glow-b {
    position: absolute;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(78, 205, 196, 0.12) 0%, transparent 70%);
    bottom: -60px; left: -60px;
  }
  .content { position: relative; padding: 2rem; }
  .title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.25rem;
  }
  .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .logotype {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--magenta), var(--purple), var(--teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1.5rem;
  }
  .swatch-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .swatch {
    width: 92px; height: 64px;
    border-radius: 8px;
    display: flex; align-items: flex-end;
    padding: 6px 8px;
    font-size: 10px;
    font-family: monospace;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="grid"></div>
    <div class="content">
      <div class="title">Wanderling marketing-site background</div>
      <div class="subtitle">Diagonal 3-stop gradient + 60px violet grid overlay + corner glow blobs</div>
      <div class="logotype">Wanderling</div>
      <div class="swatch-row">
        <div class="swatch" style="background:#ff6b9d; color:#fff;">magenta<br>#ff6b9d</div>
        <div class="swatch" style="background:#a78bfa; color:#fff;">purple<br>#a78bfa</div>
        <div class="swatch" style="background:#4ecdc4; color:#fff;">teal<br>#4ecdc4</div>
        <div class="swatch" style="background:#1a1a2e; color:#fff;">text<br>#1a1a2e</div>
        <div class="swatch" style="background:#6c757d; color:#fff;">text-muted<br>#6c757d</div>
      </div>
    </div>
  </div>
</body>
</html>
